<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema de pedidos</title><style>
:root{--c:#2563eb;--bg:#eff6ff;--ink:#172033;--muted:#64748b;--line:#dbeafe}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--ink)}header{background:linear-gradient(120deg,#1d4ed8,var(--c));color:#fff;padding:28px 20px}main{max-width:1100px;margin:auto;padding:20px}.hero{display:flex;justify-content:space-between;align-items:center;gap:15px}.hero h1{margin:0}button{border:0;border-radius:9px;padding:10px 13px;background:var(--c);color:#fff;font-weight:700;cursor:pointer}button.light{background:#dbeafe;color:#1e40af}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.layout{display:grid;grid-template-columns:1fr 340px;gap:20px}@media(max-width:800px){.layout{grid-template-columns:1fr}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 3px 12px #1d4ed80d}.price{font-size:20px;font-weight:800;color:var(--c)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:10px 0}.muted{color:var(--muted)}.hidden{display:none}.admin{margin-top:22px}.status{display:inline-block;border-radius:99px;padding:5px 9px;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:700}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid>*:last-child{grid-column:1/-1}
</style></head><body><header><main><div class="hero"><div><h1>📦 Sistema de pedidos</h1><p>Realizá un pedido y seguí su estado.</p></div><button class="light" onclick="toggleAdmin()">⚙️ Panel del negocio</button></div></main></header><main><div class="layout"><section><h2>Productos</h2><div id="products" class="grid"></div></section><aside class="panel"><h2>Tu pedido</h2><div id="cart"></div><div class="row"><span>Subtotal</span><b id="subtotal">$0</b></div><div class="row"><span>Envío</span><b>$1.200</b></div><div class="row"><b>Total</b><b id="total">$1.200</b></div><h3>Datos</h3><input id="customer" placeholder="Nombre completo"><br><br><input id="phone" placeholder="Teléfono"><br><br><input id="address" placeholder="Dirección de entrega"><br><br><textarea id="obs" rows="3" placeholder="Observaciones del pedido"></textarea><br><br><button onclick="confirmOrder()">Confirmar pedido</button><p id="result" class="status"></p></aside></div><section id="admin" class="panel admin hidden"><h2>📋 Pedidos recibidos</h2><input id="find" oninput="renderAdmin()" placeholder="Buscar por número o cliente"><div id="orders"></div></section></main><script>
const products=[{id:1,n:'Combo hamburguesa',p:8500},{id:2,n:'Pizza grande',p:9800},{id:3,n:'Ensalada',p:5200},{id:4,n:'Bebida',p:1800}];let cart={},orders=JSON.parse(localStorage.getItem('orders')||'[]');const $=id=>document.getElementById(id),money=n=>'$'+n.toLocaleString('es-AR');function render(){ $('products').innerHTML=products.map(x=>`<article class="card"><h3>${x.n}</h3><p class="price">${money(x.p)}</p><button onclick="add(${x.id})">Agregar</button></article>`).join('');renderCart()}function add(id){cart[id]=(cart[id]||0)+1;renderCart()}function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];renderCart()}function renderCart(){let ids=Object.keys(cart);$('cart').innerHTML=ids.length?ids.map(id=>{let x=products.find(p=>p.id==id);return `<div class="row"><span>${x.n}<br><small>${cart[id]} × ${money(x.p)}</small></span><span><button class="light" onclick="change(${id},-1)">−</button> <button class="light" onclick="change(${id},1)">+</button></span></div>`}).join(''):'<p class="muted">No hay productos.</p>';let s=ids.reduce((a,id)=>a+products.find(p=>p.id==id).p*cart[id],0);$('subtotal').textContent=money(s);$('total').textContent=money(s+1200)}function confirmOrder(){let ids=Object.keys(cart);if(!ids.length)return alert('Agregá productos.');if(!$('customer').value||!$('phone').value||!$('address').value)return alert('Completá tus datos.');let o={id:Date.now().toString().slice(-6),customer:$('customer').value,phone:$('phone').value,address:$('address').value,obs:$('obs').value,items:ids.map(id=>({n:products.find(p=>p.id==id).n,q:cart[id]})),total:$('total').textContent,status:'Pendiente'};orders.unshift(o);localStorage.setItem('orders',JSON.stringify(orders));cart={};renderCart();$('result').textContent='Pedido #'+o.id+' confirmado ✅';renderAdmin()}function toggleAdmin(){$('admin').classList.toggle('hidden');renderAdmin()}function nextStatus(i){let states=['Pendiente','En preparación','Listo','Enviado','Entregado','Cancelado'],o=orders[i],pos=states.indexOf(o.status);o.status=states[(pos+1)%5];localStorage.setItem('orders',JSON.stringify(orders));renderAdmin()}function renderAdmin(){let q=($('find')?.value||'').toLowerCase();$('orders').innerHTML=orders.filter(o=>(o.id+o.customer).toLowerCase().includes(q)).map((o,i)=>`<div class="card"><div class="row"><b>#${o.id} — ${o.customer}</b><span class="status">${o.status}</span></div><p>${o.items.map(x=>x.q+'× '+x.n).join(', ')}</p><small>${o.address} · ${o.phone}${o.obs?' · '+o.obs:''}</small><div class="row"><b>${o.total}</b><button onclick="nextStatus(${i})">Avanzar estado</button></div></div>`).join('')||'<p class="muted">No hay pedidos todavía.</p>'}render();
</script></body></html>
